<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Una cita nueva cada día, con estética de Windows 98.">
  <title>Daily Quotes - WordPad</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="desktop" class="desktop">
    <ul class="icons">
      <li><button type="button" class="desktop-icon" data-open="computer" title="My Computer" aria-label="My Computer"><img src="icons/my-computer.png" alt="" width="48" height="48"></button></li>
      <li><button type="button" class="desktop-icon" data-open="bin" title="Recycle Bin" aria-label="Recycle Bin"><img src="icons/recycle-bin.png" alt="" width="48" height="48"></button></li>
      <li><button type="button" class="desktop-icon" data-open="wordpad" title="citas.txt" aria-label="citas.txt"><img src="icons/my-documents.png" alt="" width="38" height="38"></button></li>
      <li><button type="button" class="desktop-icon" data-open="internet" title="Internet" aria-label="Internet"><img src="icons/internet.png" alt="" width="48" height="48"></button></li>
    </ul>

    <section id="wordpad" class="window main-window" aria-labelledby="wp-title" tabindex="-1">
      <div class="title-bar">
        <span class="title-bar-text" id="wp-title">citas.txt - WordPad</span>
        <div class="title-bar-controls">
          <button type="button" class="title-bar-btn" data-action="minimize" aria-label="Minimizar">_</button>
          <button type="button" class="title-bar-btn" data-action="maximize" aria-label="Maximizar">&#9633;</button>
          <button type="button" class="title-bar-btn" data-action="close" aria-label="Cerrar">&times;</button>
        </div>
      </div>

      <nav class="menu-bar" aria-label="Menú">
        <div class="menu">
          <button type="button" class="menu-label" aria-haspopup="true" aria-expanded="false" data-i18n="menu-file">Archivo</button>
          <div class="menu-list" role="menu">
            <button type="button" role="menuitem" data-action="save" data-i18n="act-save">Guardar en Notion</button>
            <hr>
            <button type="button" role="menuitem" data-action="close" data-i18n="act-close">Salir</button>
          </div>
        </div>
        <div class="menu">
          <button type="button" class="menu-label" aria-haspopup="true" aria-expanded="false" data-i18n="menu-edit">Editar</button>
          <div class="menu-list" role="menu">
            <button type="button" role="menuitem" data-action="copy" data-i18n="act-copy">Copiar cita</button>
          </div>
        </div>
        <div class="menu">
          <button type="button" class="menu-label" aria-haspopup="true" aria-expanded="false" data-i18n="menu-view">Ver</button>
          <div class="menu-list" role="menu">
            <button type="button" role="menuitem" data-action="prev" data-i18n="act-prev">Cita anterior</button>
            <button type="button" role="menuitem" data-action="next" data-i18n="act-next">Cita siguiente</button>
            <button type="button" role="menuitem" data-action="today" data-i18n="act-today">Hoy</button>
            <hr>
            <button type="button" role="menuitemradio" id="lang-es" aria-checked="false" data-action="lang-es" data-i18n="act-lang-es">Español</button>
            <button type="button" role="menuitemradio" id="lang-en" aria-checked="false" data-action="lang-en" data-i18n="act-lang-en">English</button>
          </div>
        </div>
        <div class="menu">
          <button type="button" class="menu-label" aria-haspopup="true" aria-expanded="false" data-i18n="menu-help">Ayuda</button>
          <div class="menu-list" role="menu">
            <button type="button" role="menuitem" data-action="about" data-i18n="act-about">Acerca de Citas Diarias</button>
          </div>
        </div>
      </nav>

      <div class="toolbar" role="toolbar" aria-label="Herramientas">
        <button type="button" class="toolbar-btn" data-action="prev" data-i18n-title="act-prev">&laquo;</button>
        <button type="button" class="toolbar-btn" data-action="next" data-i18n-title="act-next">&raquo;</button>
        <button type="button" class="toolbar-btn" id="btn-today" data-action="today" data-i18n-title="act-today">&#9679;</button>
        <span class="toolbar-separator" role="separator"></span>
        <button type="button" class="toolbar-btn" data-action="copy" data-i18n-title="act-copy">C</button>
        <button type="button" class="toolbar-btn" data-action="save" data-i18n-title="act-save">G</button>
      </div>

      <div class="editor">
        <article class="paper" aria-live="polite">
          <blockquote class="quote-text" id="quote">...</blockquote>
          <p class="quote-author" id="author"></p>
          <p class="quote-date" id="date"></p>
        </article>
        <div class="status-bar">
          <div class="status-section grow" id="status" role="status">...</div>
          <div class="status-section" id="viewDate"></div>
          <div class="status-section hide-narrow">100%</div>
          <div class="status-section hide-narrow" id="currentDate"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="start-menu" class="start-menu" hidden>
    <button type="button" data-action="open-window" id="start-open">citas.txt</button>
    <hr>
    <button type="button" data-action="about" data-i18n="act-about">Acerca de Citas Diarias</button>
  </div>

  <footer class="taskbar">
    <button type="button" id="start-button" class="btn start-button" aria-haspopup="true" aria-expanded="false"><b data-i18n="start">Inicio</b></button>
    <span class="taskbar-sep" role="separator"></span>
    <button type="button" id="task-wordpad" class="btn task-button" aria-pressed="true">citas.txt - WordPad</button>
    <time id="clock" class="tray"></time>
  </footer>

  <noscript><p class="noscript">Esta página necesita JavaScript para mostrar la cita del día.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
